category: changed
title: Vendor defaults are now generated from a semver-constraint source file
description: |
  `pkg/istiovalues/vendor_defaults.yaml` is looked up by exact Istio version, so
  every supported version needed its own entry. Maintaining that list by hand
  went stale on each patch release, silently skipping versions.

  The file is now generated by `make gen-vendor-defaults` (run as part of
  `make gen`) from `ossm/vendor_defaults.src.yaml`, whose keys are semver
  constraints such as `">=1.26.0"`. The generator expands them over the
  installable versions in `pkg/istioversion`, rejects entries that omit the
  resource-type level, and a unit test fails when the generated file is stale.
